name: Tests

on:
  push:
    branches: [ main, develop, v3 ]
  pull_request:
    branches: [ main, develop, v3 ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        stability: [prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '12.*'
            testbench: '^10.0'
            stability: prefer-lowest
        exclude:
          - php: '8.2'
            laravel: '13.*'
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction
      - name: Execute tests
        run: vendor/bin/phpunit

  code-style:
    runs-on: ubuntu-latest
    name: Code Style (Pint)
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
      - run: composer install --prefer-dist --no-interaction
      - run: vendor/bin/pint --test

  live:
    runs-on: ubuntu-latest
    name: Live smoke test (fresh Laravel app, PHP 8.4)
    env:
      # Pinned: a new Playwright release (new browser build, changed system packages) must not turn this job red.
      # Bump it deliberately, together with the cache key below.
      PLAYWRIGHT_VERSION: 1.60.0
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
      - name: Create a fresh Laravel app
        run: composer create-project laravel/laravel "$RUNNER_TEMP/live-app" --prefer-dist --no-interaction
      - name: Install the package and the live fixtures
        run: tests/Live/setup.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/live-app"
      - name: Cache the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - name: Install Playwright (Chromium) into the app
        working-directory: ${{ runner.temp }}/live-app
        run: |
          npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Run the live smoke test
        env:
          BFSG_LIVE_BROWSER: required
        run: tests/Live/smoke.sh "$RUNNER_TEMP/live-app"
