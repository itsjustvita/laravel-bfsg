name: Tests

on:
  push:
    branches: [ main, '3.1' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-stable]
        os: [ubuntu-latest]
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
          - os: ubuntu-latest
            php: '8.4'
            laravel: '12.*'
            testbench: '^10.0'
            stability: prefer-lowest
          # Older runner image, so libxml2 2.9.x is covered next to the ubuntu-latest one.
          - os: ubuntu-24.04
            php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'
            stability: prefer-stable
        exclude:
          - php: '8.2'
            laravel: '13.*'
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ matrix.os }}-php${{ matrix.php }}-l${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
      - name: Show libxml version
        run: php -r 'echo LIBXML_DOTTED_VERSION, PHP_EOL;'
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction
      - name: Execute tests
        run: vendor/bin/phpunit -c phpunit.xml.dist
      - name: Execute performance tests
        if: matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && matrix.os == 'ubuntu-latest'
        # Wall-clock budgets, scaled for shared runners.
        run: BFSG_PERF_FACTOR=3 vendor/bin/phpunit -c phpunit.xml.dist --group performance

  code-style:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Code Style (Pint)
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip
      - run: composer install --prefer-dist --no-interaction
      # Exact Pint version, so a new Pint release cannot turn this job red.
      - run: composer require --dev "laravel/pint:1.32.1" --no-interaction -W
      - run: vendor/bin/pint --test

  live:
    # Pinned: Playwright 1.60 has no chromium build for ubuntu 26.04 (what ubuntu-latest now is).
    # Move to ubuntu-latest together with a deliberate Playwright bump.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    name: Live smoke test (fresh Laravel app, PHP 8.5)
    env:
      # Pinned: a new Playwright release (new browser build, changed system packages) must not turn this job red.
      # Bump it deliberately, together with the cache key below.
      PLAYWRIGHT_VERSION: 1.60.0
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
      - name: Create a fresh Laravel app
        run: composer create-project laravel/laravel "$RUNNER_TEMP/live-app" --prefer-dist --no-interaction
      - name: Install the package and the live fixtures
        run: tests/Live/setup.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/live-app"
      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - name: Install Playwright (Chromium) into the app
        working-directory: ${{ runner.temp }}/live-app
        run: |
          npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Run the live smoke test
        env:
          BFSG_LIVE_BROWSER: required
        run: tests/Live/smoke.sh "$RUNNER_TEMP/live-app"
