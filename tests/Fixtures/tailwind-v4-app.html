<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Rocketship</title>
    <style data-bfsg-inlined="/build/assets/app-4ed993c7.css">

        @layer theme, base, components, utilities;
        @layer theme {

                --color-gray-100: oklch(96.7% 0.003 264.542);
                --color-gray-300: oklch(87.2% 0.01 258.338);
                --color-gray-400: oklch(70.7% 0.022 261.325);
                --color-gray-500: oklch(55.1% 0.027 264.364);
                --color-gray-900: oklch(21% 0.034 264.665);

                --color-indigo-400: oklch(67.3% 0.182 276.935);

                --color-indigo-600: oklch(51.1% 0.262 276.966);

                --color-white: #fff;

                --text-sm: 0.875rem;
                --text-sm--line-height: calc(1.25 / 0.875);

                --default-font-family: var(--font-sans);

        @layer base {

            .px-3 { padding-inline: calc(var(--spacing) * 3); }

            .text-gray-500 { color: var(--color-gray-500); }
            .text-gray-900 { color: var(--color-gray-900); }
            .text-white { color: var(--color-white); }
            .text-white\/70 {
                color: color-mix(in srgb, #fff 70%, transparent);
                @supports (color: color-mix(in lab, red, red)) { color: color-mix(in oklab, var(--color-white) 70%, transparent); }

            .hover\:bg-indigo-500 { &:hover { @media (hover: hover) { background-color: var(--color-indigo-500); } } }

<body class="bg-white text-gray-900 dark:bg-gray-950 dark:text-gray-100">
<header>
    <nav aria-label="Global" class="flex">
        <a href="/" class="text-gray-900 dark:text-white"><img src="/logo.svg" alt="Rocketship"></a>
        <a href="/features" class="text-sm font-semibold text-gray-900 dark:text-white">Features</a>
        <a href="/pricing" class="text-sm font-semibold text-gray-900 dark:text-white">Pricing</a>
        <button type="button" class="text-gray-400 hover:text-gray-500 dark:text-gray-400 dark:hover:text-white">
            <span class="sr-only">Open main menu</span>
            <svg class="size-6" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
        </button>
        <button type="button" class="text-gray-400 hover:text-gray-500 dark:text-gray-400 dark:hover:text-white">
            <span class="sr-only">View notifications</span>
            <svg class="size-6" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31"/></svg>
        </button>
    </nav>
</header>
<main>
    <section aria-labelledby="hero-title">
        <h1 id="hero-title" class="text-4xl sm:text-6xl font-semibold text-gray-900 dark:text-white">Launch faster with Rocketship</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400" id="fineprint">No credit card required. Cancel anytime.</p>
        <a href="/signup" class="rounded-md bg-indigo-600 px-3 text-white text-sm font-semibold hover:bg-indigo-500 focus-visible:outline-2">Get started</a>
    </section>
    <section aria-label="Legal">
        <p class="text-sm text-gray-500 dark:text-gray-300" id="legal">Prices exclude VAT.</p>
    </section>
    <section aria-label="Updates" class="rounded-md bg-white dark:bg-white/5">
        <p id="update" class="text-gray-900 dark:text-white">New: a dashboard for every team.</p>
        <span id="badge" class="rounded-md bg-black/50 px-3 text-sm text-white/70">Beta</span>
        <a href="/changelog" class="text-sm font-semibold text-gray-900 dark:text-white">Changelog for version 2</a>
    </section>
    <section aria-label="Testimonials">
        <figure>
            <blockquote class="text-gray-900 dark:text-white"><p>Rocketship cut our release time in half.</p></blockquote>
            <figcaption class="text-gray-500 dark:text-gray-400">Jane Doe, CTO</figcaption>
        </figure>
    </section>
</main>
<footer>
    <p class="text-sm text-gray-500 dark:text-gray-400">&copy; 2026 Rocketship, Inc.</p>
</footer>
</body>
</html>
