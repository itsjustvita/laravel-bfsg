<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Launch faster with Rocketship | Rocketship</title>
    <style>
        @layer theme, base, components, utilities;
        @layer theme {
            :root { --color-gray-400: oklch(70.7% 0.022 261.325); --color-indigo-600: oklch(51.1% 0.262 276.966); --font-sans: ui-sans-serif, system-ui; }
        }
        @layer base {
            *, ::after, ::before { box-sizing: border-box; border: 0 solid; margin: 0; padding: 0; }
            html { font-family: var(--font-sans); line-height: 1.5; }
            a { color: inherit; text-decoration: inherit; }
        }
        @layer utilities {
            .bg-white { background-color: #ffffff; }
            .bg-indigo-600 { background-color: #4f46e5; }
            .hover\:bg-indigo-500:hover { background-color: #6366f1; }
            .text-white { color: #ffffff; }
            .text-gray-900 { color: #111827; }
            .text-gray-400 { color: #9ca3af; }
            .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
            .text-sm { font-size: .875rem; }
            .font-semibold { font-weight: 600; }
            .rounded-md { border-radius: .375rem; }
            .focus-visible\:outline-2:focus-visible { outline-style: solid; outline-width: 2px; }
            .focus\:outline-none:focus { outline: 2px solid transparent; outline-offset: 2px; }
            .focus\:ring-2:focus { box-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color); }
            @media (width >= 40rem) { .sm\:text-6xl { font-size: 3.75rem; line-height: 1; } }
            @media print { .print\:hidden { display: none; } }
            @supports (color: oklch(0 0 0)) { .text-muted-modern { color: oklch(55% 0 0); } }
        }
    </style>
</head>
<body class="bg-white">
<header>
    <nav aria-label="Global">
        <a href="/" class="text-gray-900"><img src="/logo.svg" alt="Rocketship"></a>
        <a href="/features" class="text-gray-900">Features</a>
        <a href="/pricing" class="text-gray-900">Pricing</a>
    </nav>
</header>
<main>
    <section aria-labelledby="hero-title">
        <h1 id="hero-title" class="text-4xl sm:text-6xl font-semibold text-gray-900">Launch faster with Rocketship</h1>
        <p class="text-sm text-gray-400" id="fineprint">No credit card required. Cancel anytime.</p>
        <a href="/signup" class="rounded-md bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-500 focus-visible:outline-2">Get started</a>
        <button type="button" class="rounded-md bg-indigo-600 text-white focus:outline-none focus:ring-2">Watch the demo</button>
    </section>
    <section aria-label="Testimonials">
        <figure>
            <blockquote class="text-gray-900"><p>Rocketship cut our release time in half.</p></blockquote>
            <figcaption class="text-gray-900">Jane Doe, CTO</figcaption>
        </figure>
    </section>
</main>
<footer>
    <p class="text-gray-900">&copy; 2026 Rocketship, Inc.</p>
</footer>
</body>
</html>
